apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-sre-agent
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-sre-agent
  template:
    metadata:
      labels:
        app: ai-sre-agent
    spec:
      containers:
        - name: ai-sre-agent
          image: ghcr.io/vinaygaddam123/ai-sre-agent:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: agent-secrets
          env:
            - name: PROMETHEUS_URL
              value: "http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090"
            - name: POLL_SECONDS
              value: "60"
          resources:
            requests:
              memory: "64Mi"
            limits:
              memory: "128Mi"