name: build-and-deploy-agent

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/build-agent.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/vinaygaddam123/ai-sre-agent

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create a temporary Kubernetes cluster
        uses: helm/kind-action@v1

      - name: Create a dummy secret (no real key in CI)
        run: |
          kubectl create secret generic agent-secrets \
            --from-literal=GEMINI_API_KEY=dummy-ci-key \
            --from-literal=GEMINI_MODEL=gemini-flash-lite-latest

      - name: Deploy the new image
        run: |
          kubectl apply -f k8s/agent-deployment.yaml
          kubectl set image deployment/ai-sre-agent "*=${{ env.IMAGE }}:${{ github.sha }}"

      - name: Verify the rollout
        run: |
          kubectl rollout status deployment/ai-sre-agent --timeout=180s
          sleep 15
          kubectl get pods
          kubectl logs deployment/ai-sre-agent | tee agent.log
          grep -q "Agent started" agent.log

  deploy-cluster:
    needs: deploy
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Roll out the new image to the cluster with Terraform
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false \
            -state=/workspaces/ai-sre-agent/terraform/terraform.tfstate \
            -var="image=${{ env.IMAGE }}:${{ github.sha }}"

      - name: Verify the rollout
        run: |
          kubectl rollout status deployment/ai-sre-agent --timeout=180s
          kubectl get deployment ai-sre-agent -o jsonpath='{.spec.template.spec.containers[0].image}'